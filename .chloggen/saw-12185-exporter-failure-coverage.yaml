change_type: bug_fix
component: pkg/exporterhelper
note: Record zero send-failed items after successful nonempty exports so active exporters expose failure-counter coverage.
issues: [16]
subtext: |
  Idle exporters and empty exports do not create failure points. Positive failure
  counts retain their error attributes. The additional zero point has only the
  exporter attribute and does not change the aggregate failure count.
