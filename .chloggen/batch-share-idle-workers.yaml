change_type: enhancement
component: processor/batch
note: Add an opt-in share_idle_workers setting so idle metadata workers can serve a busy metadata group.
issues: [18]
subtext: |
  The setting defaults to false and preserves per-group input capacity and total worker count.
  It requires concurrency-safe downstream consumers and permits same-metadata completion out of order, even with num_shards set to one.
change_logs: [user, api]
